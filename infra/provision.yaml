---
- name: Prepare an existing Ubuntu GPU host for the native runtime
  hosts: gpu
  gather_facts: true
  tasks:
    - name: Require the validated host distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
    - name: Install native build prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - python3
          - python3-venv
          - libcurl4-openssl-dev
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Verify the existing GPU driver
      ansible.builtin.command:
        argv: [nvidia-smi, '--query-gpu=name,driver_version,memory.total', '--format=csv,noheader']
      changed_when: false
    - name: Verify the existing NVIDIA Container Toolkit
      ansible.builtin.command:
        argv: [nvidia-ctk, --version]
      changed_when: false
